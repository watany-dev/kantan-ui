name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.0"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lockb') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install

      - name: Generate package-lock.json for audit
        run: npm i --package-lock-only --ignore-scripts

      - name: Run npm audit (high severity)
        run: npm audit --audit-level=high

      - name: Check moderate vulnerabilities
        run: |
          npm audit --audit-level=moderate || echo "::warning::Moderate vulnerabilities found. Review recommended."

      - name: List dependencies
        run: bun pm ls --all
